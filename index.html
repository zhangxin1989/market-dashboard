<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投资数据仪表盘</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#0f1117; color:#e0e0e0; }
.container { max-width:1400px; margin:0 auto; padding:20px; }
h1 { text-align:center; margin:15px 0 5px; font-size:24px; color:#fff; }
.subtitle { text-align:center; color:#888; margin-bottom:5px; font-size:13px; }
.span-bar { text-align:center; margin:10px 0 20px; }
.span-bar button { background:#1a1d27; color:#888; border:1px solid #333; padding:5px 15px; margin:0 3px; border-radius:4px; cursor:pointer; font-size:13px; }
.span-bar button.active { background:#4a9eff; color:#fff; border-color:#4a9eff; }
.chart-row { display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:15px; }
.chart-box { background:#1a1d27; border-radius:8px; padding:15px; }
.chart-box h2 { font-size:14px; color:#aaa; margin-bottom:10px; }
.chart { width:100%; height:300px; }
.table-box { background:#1a1d27; border-radius:8px; padding:15px; margin-top:5px; }
table { width:100%; border-collapse:collapse; }
th,td { padding:8px 12px; text-align:center; }
th { color:#888; font-size:12px; border-bottom:1px solid #333; }
td { font-size:14px; border-bottom:1px solid #222; }
.danger { color:#ef4444; }
.warning { color:#eab308; }
.success { color:#22c55e; }
@media(max-width:768px){ .chart-row{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="container">

function build(opt,id,key,thresholds){
  var chart=echarts.init(document.getElementById(id));
  var series=[];
  for(var i=0;i<key.length;i++){
    series.push({name:key[i][0],type:'line',data:DATA.dates.map(function(d,j){var v=DATA[key[i][1]][key[i][0]];return v&&v[j]?v[j]:null;}),
      smooth:true,symbol:'none',lineStyle:{width:2}});
  }
  var markAreas=[];
  if(thresholds){
    var yAx=opt.yAxis;
    yAx={type:'value',scale:true,
      splitLine:{axisLine:{lineStyle:{color:'#333'}}},
      axisLabel:{formatter:function(v){return v.toFixed(0)+'%'},color:'#888'},
      axisPointer:{label:{formatter:function(v){return v.toFixed(1)+'%'}}}
    };
    opt.yAxis=yAx;
  }
  opt.xAxis={type:'category',data:DATA.dates,axisLabel:{color:'#888'},axisLine:{lineStyle:{color:'#333'}}};
  opt.yAxis=opt.yAxis||{type:'value',scale:true,splitLine:{lineStyle:{color:'#222'}},axisLabel:{color:'#888'}};
  opt.legend={textStyle:{color:'#ccc',fontSize:11},top:0,type:'scroll'};
  opt.tooltip={trigger:'axis',axisPointer:{type:'cross'}};
  opt.grid={left:50,right:30,top:35,bottom:50};
  opt.dataZoom=[{type:'inside'},{type:'slider',height:18,bottom:10}];
  opt.color=colors;
  opt.series=series;
  chart.setOption(opt);
  return chart;
}

function addZones(chart,lo,hi){
  var opt=chart.getOption();
  var ma=[];
  if(hi)ma.push([{yAxis:hi,itemStyle:{color:'rgba(239,68,68,0.06)'}},{yAxis:100}]);
  ma.push([{yAxis:lo,itemStyle:{color:'rgba(234,179,8,0.06)'}},{yAxis:hi}]);
  ma.push([{yAxis:0,itemStyle:{color:'rgba(34,197,94,0.06)'}},{yAxis:lo}]);
  opt.series[0].markArea={silent:true,data:ma};
  chart.setOption(opt);
}
